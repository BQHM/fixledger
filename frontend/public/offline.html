<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#f4f6fa" />
    <title>FixLedger - 当前离线</title>
    <style>
      :root {
        color-scheme: only light;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f4f6fa;
        color: #111827;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background: #f4f6fa;
      }

      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.82);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.68);
        box-shadow: 0 24px 60px rgba(31, 41, 55, 0.1), inset 0 1px 0 #fff;
        backdrop-filter: blur(24px) saturate(170%);
        -webkit-backdrop-filter: blur(24px) saturate(170%);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
        font-weight: 800;
      }

      .mark {
        display: grid;
        width: 42px;
        height: 42px;
        border-radius: 13px;
        place-items: center;
        background: #ff6900;
        color: #fff;
        font-size: 21px;
      }

      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0; color: #64748b; line-height: 1.7; }

      button {
        width: 100%;
        min-height: 46px;
        margin-top: 24px;
        border: 0;
        border-radius: 14px;
        background: #ff6900;
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:focus-visible { outline: 3px solid rgba(255, 105, 0, 0.28); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark">F</span><span>FixLedger</span></div>
      <h1>当前网络不可用</h1>
      <p>恢复网络连接后重试，即可继续查看家庭设备档案。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
