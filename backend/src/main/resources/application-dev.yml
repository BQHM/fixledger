spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fixledger}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:fixledger}
    password: ${MYSQL_PASSWORD:fixledger_dev_password}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:db/schema.sql
      data-locations: ${SQL_DATA_LOCATIONS:classpath:db/demo-data.sql}
      encoding: UTF-8
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

logging:
  level:
    com.fixledger: info
    org.springframework.security: info
