spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:fixledger;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  data:
    redis:
      host: localhost
      port: 6379
      database: 1

logging:
  level:
    com.fixledger: debug
fixledger:
  file:
    storage-type: local
    local-root: ./target/test-uploads
  ai:
    enabled: false
    provider: mock
    api-key:
    base-url:
    model:
  jwt:
    secret: fixledger-local-dev-secret-must-be-replaced
    access-token-ttl-seconds: 86400


