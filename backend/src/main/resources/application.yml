server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: fixledger
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:20MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:25MB}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info}
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

fixledger:
  jwt:
    secret: ${JWT_SECRET:fixledger-local-dev-secret-must-be-replaced}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:86400}
  file:
    storage-type: ${FILE_STORAGE_TYPE:local}
    local-root: ${FILE_STORAGE_ROOT:./uploads}
    s3:
      endpoint: ${FILE_S3_ENDPOINT:http://localhost:9000}
      access-key: ${FILE_S3_ACCESS_KEY:fixledger}
      secret-key: ${FILE_S3_SECRET_KEY:fixledger123}
      bucket: ${FILE_S3_BUCKET:fixledger-files}
      region: ${FILE_S3_REGION:us-east-1}
      path-style-access: ${FILE_S3_PATH_STYLE_ACCESS:true}
      create-bucket: ${FILE_S3_CREATE_BUCKET:true}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
  reminder:
    scan-cron: ${REMINDER_SCAN_CRON:0 0 8 * * *}
  dashboard:
    summary-cache-enabled: ${DASHBOARD_SUMMARY_CACHE_ENABLED:true}
    summary-cache-ttl: ${DASHBOARD_SUMMARY_CACHE_TTL:2m}
  export:
    max-sync-rows: ${EXPORT_MAX_SYNC_ROWS:5000}
  notification:
    dispatch-cron: ${NOTIFICATION_DISPATCH_CRON:0 */1 * * * *}
    batch-size: ${NOTIFICATION_BATCH_SIZE:50}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
    retry-delay: ${NOTIFICATION_RETRY_DELAY:5m}
    max-retry-delay: ${NOTIFICATION_MAX_RETRY_DELAY:6h}
    connect-timeout: ${NOTIFICATION_CONNECT_TIMEOUT:5s}
    request-timeout: ${NOTIFICATION_REQUEST_TIMEOUT:10s}
    processing-timeout: ${NOTIFICATION_PROCESSING_TIMEOUT:15m}
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
      from: ${NOTIFICATION_EMAIL_FROM:}
    webhook:
      enabled: ${NOTIFICATION_WEBHOOK_ENABLED:false}
      endpoint: ${NOTIFICATION_WEBHOOK_ENDPOINT:}
      secret: ${NOTIFICATION_WEBHOOK_SECRET:}
      allow-insecure-http: ${NOTIFICATION_WEBHOOK_ALLOW_INSECURE_HTTP:false}
