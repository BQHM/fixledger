name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: mvn -q test
        env:
          SPRING_PROFILES_ACTIVE: test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend type check
        run: npx vue-tsc --noEmit -p tsconfig.json

      - name: Build frontend
        run: npx vite build --outDir dist-ci --emptyOutDir

      - name: Run frontend smoke check
        run: npm run smoke

      - name: Audit frontend production dependencies
        run: npm audit --registry=https://registry.npmjs.org --audit-level=critical --omit=dev

  compose:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Validate production Docker Compose config
        run: >-
          docker compose --env-file .env.production.example
          -f docker-compose.prod.yml config --quiet

      - name: Run Docker health check dry run
        shell: pwsh
        run: ./scripts/check-docker-health.ps1 -DryRun

      - name: Run production readiness check
        shell: pwsh
        run: >-
          ./scripts/check-production-readiness.ps1 -Strict
          -ProductionEnvFile .env.production.example
