services:
  # =========================================
  # 1. MySQL 数据库服务
  # -----------------------------------------
  # 作用：
  #   - 存储用户、家庭空间、设备、保修、耗材、维修、提醒、AI 分析等业务数据。
  #   - 使用命名卷持久化数据，容器重启后数据不会丢失。
  # =========================================
  mysql:
    image: mysql:8.4
    container_name: fixledger-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fixledger}
      MYSQL_USER: ${MYSQL_USERNAME:-fixledger}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fixledger_dev_password}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =========================================
  # 2. Redis 缓存服务
  # -----------------------------------------
  # 作用：
  #   - 提醒去重、首页统计缓存、后续验证码和临时缓存。
  #   - 开启 AOF，保证开发环境重启后缓存数据尽量保留。
  # =========================================
  redis:
    image: redis:7.4-alpine
    container_name: fixledger-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================================
  # 3. RustFS 对象存储服务
  # -----------------------------------------
  # 作用：
  #   - 存储发票、保修卡、说明书、维修单等附件内容。
  #   - 兼容 S3 API，后端通过 AWS S3 SDK 访问。
  # =========================================
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    container_name: fixledger-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: ${FILE_S3_ACCESS_KEY:-fixledger}
      RUSTFS_SECRET_KEY: ${FILE_S3_SECRET_KEY:-fixledger123}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    command:
      - --address
      - :9000
      - --console-enable
      - --access-key
      - ${FILE_S3_ACCESS_KEY:-fixledger}
      - --secret-key
      - ${FILE_S3_SECRET_KEY:-fixledger123}
      - /data

  # =========================================
  # 4. 后端应用服务
  # -----------------------------------------
  # 作用：
  #   - 提供认证、设备档案、保修、耗材、维修、提醒、看板和 AI 辅助接口。
  #   - 默认连接 compose 网络内的 mysql / redis 服务。
  # =========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:21-jre}
    container_name: fixledger-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fixledger}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-fixledger}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fixledger_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      JWT_SECRET: ${JWT_SECRET:-fixledger-docker-dev-secret-change-me-32-bytes}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-86400}
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE:-rustfs}
      FILE_STORAGE_ROOT: /app/uploads
      FILE_S3_ENDPOINT: ${FILE_S3_ENDPOINT:-http://rustfs:9000}
      FILE_S3_ACCESS_KEY: ${FILE_S3_ACCESS_KEY:-fixledger}
      FILE_S3_SECRET_KEY: ${FILE_S3_SECRET_KEY:-fixledger123}
      FILE_S3_BUCKET: ${FILE_S3_BUCKET:-fixledger-files}
      FILE_S3_REGION: ${FILE_S3_REGION:-us-east-1}
      FILE_S3_PATH_STYLE_ACCESS: ${FILE_S3_PATH_STYLE_ACCESS:-true}
      FILE_S3_CREATE_BUCKET: ${FILE_S3_CREATE_BUCKET:-true}
      FILE_MAX_SIZE: ${FILE_MAX_SIZE:-20MB}
      FILE_MAX_REQUEST_SIZE: ${FILE_MAX_REQUEST_SIZE:-25MB}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-always}
      SQL_DATA_LOCATIONS: ${SQL_DATA_LOCATIONS:-classpath:db/demo-data.sql}
      REMINDER_SCAN_CRON: ${REMINDER_SCAN_CRON:-0 0 8 * * *}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads

  # =========================================
  # 5. 前端 Web 服务
  # -----------------------------------------
  # 作用：
  #   - 构建 Vue3 静态页面并通过 Nginx 提供访问。
  #   - 将 /api、/actuator、/swagger-ui 等路径代理到 backend 服务。
  # =========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: fixledger-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

# =========================================
# 数据卷
# -----------------------------------------
# docker compose down 不会删除这些卷；只有 docker compose down -v 才会清空数据。
# =========================================
volumes:
  mysql_data:
  redis_data:
  rustfs_data:
  backend_uploads:
